<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회독 수 체크</title>
<style>
  :root {
    --ink:#493b36; --muted:#8d7b73; --paper:#fffaf5; --line:#f0e4dc;
    --accent:#d96b67; --soft:#f8e9e3;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; padding:34px 18px 54px;
    background:linear-gradient(160deg,#fff8f2 0%,#fffdfb 55%,#f8f0e9 100%);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  .wrap { width:min(900px,100%); margin:0 auto; }
  header { text-align:center; margin-bottom:28px; }
  .eyebrow { color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.18em; }
  h1 { margin:9px 0 8px; font-size:clamp(27px,5vw,38px); letter-spacing:-.06em; }
  .sub { margin:0; color:var(--muted); font-size:14px; }
  .summary {
    margin:24px auto 22px; padding:17px 20px; border:1px solid var(--line);
    border-radius:18px; background:#ffffffc9; display:flex; justify-content:space-between;
    align-items:center; gap:12px; box-shadow:0 8px 24px #7d59400b;
  }
  .summary strong { font-size:24px; color:var(--accent); }
  .progress { height:8px; background:#f2e8e1; border-radius:20px; overflow:hidden; margin-top:9px; }
  .bar { height:100%; width:0%; background:linear-gradient(90deg,#e9a18e,#cf5e5e); transition:width .25s; }
  .summary-left { flex:1; }
  .summary-label { font-size:12px; color:var(--muted); }
  .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .card {
    background:#fff; border:1px solid var(--line); border-radius:20px; padding:19px 18px 15px;
    box-shadow:0 8px 24px #7d59400a; min-width:0;
  }
  .card-top { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  h2 { margin:0; font-size:19px; letter-spacing:-.04em; }
  .count { color:var(--muted); font-size:12px; white-space:nowrap; }
  .apples { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px 5px; margin:16px 0 10px; }
  .apple {
    border:0; padding:2px; background:transparent; cursor:pointer; border-radius:12px;
    aspect-ratio:1; display:grid; place-items:center; transition:transform .15s, background .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .apple:hover { transform:translateY(-2px); background:#fff7f3; }
  .apple:focus-visible { outline:3px solid #e9a18e; outline-offset:2px; }
  .apple img { display:block; width:100%; height:100%; object-fit:contain; filter:grayscale(1); opacity:.19; transition:filter .2s,opacity .2s; }
  .apple.done img { filter:none; opacity:1; }
  .hint { font-size:11px; color:#a18f86; text-align:center; margin:0; }
  .actions { display:flex; justify-content:center; gap:10px; margin-top:23px; }
  button.reset {
    border:1px solid #e9d8ce; background:#fff; color:#8a7065; border-radius:999px;
    padding:10px 17px; font-size:12px; font-weight:700; cursor:pointer;
  }
  button.reset:hover { background:#fff5ef; }
  @media(max-width:560px) {
    body { padding:26px 13px 40px; }
    .cards { grid-template-columns:1fr; gap:11px; }
    .card { padding:17px 16px 13px; }
    .apples { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .apple { max-width:88px; justify-self:center; width:100%; }
    .summary { padding:14px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">MY STUDY TRACKER</div>
    <h1>오늘의 회독 기록</h1>
    <p class="sub">사과를 하나씩 눌러 회독을 체크해 보세요.</p>
  </header>
  <section class="summary" aria-live="polite">
    <div class="summary-left">
      <div class="summary-label">전체 회독 진행률</div>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </div>
    <div><strong id="total">0</strong><span class="summary-label"> / 33회</span></div>
  </section>
  <main class="cards" id="cards"></main>
  <div class="actions">
    <button class="reset" id="reset">전체 체크 초기화</button>
  </div>
</div>

const cards = document.getElementById("cards");

subjects.forEach(([name, amount], subjectIndex) => {
  const card = document.createElement("section");
  card.className = "card";
  card.innerHTML = `
    <div class="card-top">
      <h2>${name}</h2>
      <span class="count"><b class="done-count">0</b> / ${amount}회 완료</span>
    </div>
    <div class="apples" aria-label="${name} 회독 체크"></div>
    <p class="hint">사과를 누르면 회독 완료 · 다시 누르면 취소</p>
  `;
  const appleGrid = card.querySelector(".apples");
  for (let i=0; i<amount; i++) {
    const apple = document.createElement("button");
    apple.className = "apple";
    apple.type = "button";
    apple.setAttribute("aria-label", `${name} ${i+1}회독 미완료`);
    apple.setAttribute("aria-pressed", "false");
    apple.innerHTML = `<img src="${appleImage}" alt="">`;
    apple.addEventListener("click", () => {
      const done = apple.classList.toggle("done");
      apple.setAttribute("aria-pressed", String(done));
      apple.setAttribute("aria-label", `${name} ${i+1}회독 ${done ? "완료" : "미완료"}`);
      update();
    });
    appleGrid.appendChild(apple);
  }
  cards.appendChild(card);
});
function update() {
  let completed = 0, possible = 0;
  document.querySelectorAll(".card").forEach(card => {
    const apples = [...card.querySelectorAll(".apple")];
    const done = apples.filter(a => a.classList.contains("done")).length;
    completed += done; possible += apples.length;
    card.querySelector(".done-count").textContent = done;
  });
  document.getElementById("total").textContent = completed;
  document.getElementById("bar").style.width = `${completed/possible*100}%`;
}
document.getElementById("reset").addEventListener("click", () => {
  document.querySelectorAll(".apple").forEach(apple => {
    apple.classList.remove("done");
    apple.setAttribute("aria-pressed", "false");
    const label = apple.getAttribute("aria-label").replace("완료","미완료");
    apple.setAttribute("aria-label", label);
  });
  update();
});
</script>
